services:
  - type: web
    name: teamforge-api
    runtime: docker
    rootDir: teamforge-api
    dockerfilePath: ./Dockerfile
    preDeployCommand: php artisan migrate --force
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        value: https://teamforge-api-3jwt.onrender.com
      - key: APP_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://teamforge-rho-six.vercel.app
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_LOGIN_CALLBACK_URL
        value: https://teamforge-api-3jwt.onrender.com/api/auth/github/callback
      - key: GITHUB_LOGIN_FRONTEND_REDIRECT_URL
        value: https://teamforge-rho-six.vercel.app/login
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
