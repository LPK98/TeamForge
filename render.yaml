services:
  - type: web
    name: teamforge-api
    runtime: docker
    rootDir: teamforge-api
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        value: https://teamforge-prv0.onrender.com
      - key: APP_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://teamforge-rho-six.vercel.app
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
