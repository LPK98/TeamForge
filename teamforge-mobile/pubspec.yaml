name: teamforge_mobile
description: TeamForge mobile client for the existing Laravel API.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.7.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  dio: ^5.11.1
  go_router: ^18.1.4
  flutter_secure_storage: ^11.2.0
  cached_network_image: ^4.0.3
  image_picker: ^1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
